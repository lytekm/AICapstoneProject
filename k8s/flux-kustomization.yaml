# Flux Kustomization -- tells Flux to reconcile the k8s/base directory.
# Drop this file into your Flux repo's cluster path so it picks up
# the summarizer manifests automatically on merge to main.
#
# Assumes the GitRepository source "uas-repo" is already defined
# (see flux-source.yaml). Flux will apply the kustomization every
# 5 minutes or on git push via webhook.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: summarizer
  namespace: flux-system
spec:
  interval: 5m
  path: ./k8s/base
  prune: true
  sourceRef:
    kind: GitRepository
    name: uas-repo
  targetNamespace: summarizer
  # wait for all resources to become ready before marking healthy
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: api
      namespace: summarizer
    - apiVersion: apps/v1
      kind: Deployment
      name: vllm
      namespace: summarizer
