[project]
name = "user-adaptive-summarization"
version = "0.2.0"
description = "Hybrid extractive-abstractive summarization with persona support"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "nltk>=3.8",
    "rouge-score>=0.1.2",
    "feedparser>=6.0",
    "trafilatura>=1.8",
    "datasets>=2.19",
    "pandas>=2.2",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "openai>=1.30",
    "spacy>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src", "api"]
omit = [
    "src/run_*.py",
    "src/diagram_generator.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
